<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1150"/>
      <stop offset="1" stop-color="#0d0618"/>
    </linearGradient>
    <radialGradient id="glow" cx=".46" cy=".46" r=".6">
      <stop offset="0" stop-color="#9333ea" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd2ff"/>
      <stop offset=".45" stop-color="#b266ff"/>
      <stop offset="1" stop-color="#7a2ee6"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b3cf0"/>
      <stop offset="1" stop-color="#d9a6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#05010c" flood-opacity=".65"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="#b266ff" stroke-opacity=".35" stroke-width="4"/>

  <g filter="url(#shadow)" transform="translate(16 0)">
    <!-- demon tail: comes off the top of the J, arches over to the left and hangs down to a spade tip -->
    <path d="M240 224 C 238 172, 170 150, 130 180 C 104 200, 104 250, 112 278 C 118 302, 100 316, 80 312"
          fill="none" stroke="url(#tail)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- spade tip, flicking out to the left -->
    <path transform="translate(66 308) rotate(-100) scale(.85)"
          d="M0 -50 C 10 -28, 38 -16, 38 6 C 38 24, 18 30, 0 16 C -18 30, -38 24, -38 6 C -38 -16, -10 -28, 0 -50 Z"
          fill="url(#tail)"/>
    <!-- JS -->
    <text x="276" y="362" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif"
          font-weight="900" font-size="222" letter-spacing="-10" fill="url(#ink)">JS</text>
  </g>
</svg>
